<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="main">
        <h2>Metric/Imperial Unit Conversion</h2>
        <input type="text" id="given-value">
        <button id="btn-convert">Convert</button>
    </div>
    <div class="card">
        <h4>Length (Meter/Feet)</h4>
        <p id="length-value"></p>
    </div>
    <div class="card">
        <h4>Volume (Liters/Gallons)</h4>
        <p id="volume-value"></p>
    </div>
    <div class="card">
        <h4>Mass (Kilograms/Pounds)</h4>
        <p id="mass-value"></p>
    </div>
    <script src="index.js"></script>
</body>

</html>
